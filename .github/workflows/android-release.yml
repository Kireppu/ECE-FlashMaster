# Build signed Android release and publish APK(s) to GitHub Releases on tag push (e.g. v1.2.3)
# Triggers: push tags matching v*, and manual workflow_dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build, sign and publish Release APKs
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: '33.0.2'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode release keystore (from secret KEYSTORE_BASE64)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore to release-keystore.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            ls -l release-keystore.jks
          else
            echo "No KEYSTORE_BASE64 secret found — aborting (release needs keystore)."
            exit 1
          fi

      - name: Build signed release APK(s)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/release-keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect release APKs and generate checksums
        run: |
          mkdir -p release-artifacts
          # Collect any release APKs (handles product flavors / splits)
          find app/build/outputs/apk -type f -name '*release*.apk' -exec cp {} release-artifacts/ \; || true
          echo "Release artifacts:"
          ls -la release-artifacts || true
          if [ "$(ls -A release-artifacts 2>/dev/null)" = "" ]; then
            echo "No release APKs found — failing."
            ls -R app/build/outputs || true
            exit 1
          fi
          pushd release-artifacts
          for f in *.apk; do
            sha256sum "$f" >> checksums.txt
          done
          popd
          ls -la release-artifacts

      - name: Create GitHub Release and upload APKs + checksums
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
